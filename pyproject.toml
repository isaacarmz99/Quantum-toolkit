[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-toolkit"
version = "0.1.0"
description = "A quantum software engineering portfolio project: benchmarking, testing, and algorithm implementations built on Qiskit."
requires-python = ">=3.10"
dependencies = [
    "qiskit>=1.0",
    "qiskit-aer>=0.14",
    "qiskit-algorithms>=0.3",
    "numpy",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["src"]
